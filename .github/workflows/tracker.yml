name: Daily Severe Weather Tracker

on:
  schedule:
    - cron: '0 0 * * *'  # Esegue automaticamente ogni giorno a mezzanotte
  workflow_dispatch:     # Permette l'esecuzione manuale in qualsiasi momento da smartphone

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install feedparser

      - name: Run Tracker Script
        run: |
          python fetch_events.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add events.geojson
          git commit -m "Auto-update: Aggiornamento archivio eventi severi" || exit 0
          git push
          
